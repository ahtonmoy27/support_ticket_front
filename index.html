<!doctype html>
<html lang="en" translate="no" class="notranslate">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/desk.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Support Desk – a unified workspace for managing customer tickets, SLA commitments, and team collaboration." />
    <meta name="theme-color" content="#174a40" />
    <title>Support Desk</title>
  </head>
  <body>
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #fff; color: #174a40; user-select: none; text-align: center; gap: 12px; padding: 20px;">
        <div style="width: 64px; height: 64px; background: linear-gradient(135deg, #174a40 0%, #1e5c4f 100%); border-radius: 20px; display: grid; place-items: center; box-shadow: 0 12px 28px -6px rgba(23, 74, 64, 0.38);">
          <svg viewBox="0 0 40 40" width="36" height="36" fill="none"><path d="M11 12h18v13H19l-6 5v-5h-2z" stroke="#e9f5b7" stroke-width="2.5" stroke-linejoin="round"/><path d="M16 17h8m-8 4h5" stroke="#e9f5b7" stroke-width="2" stroke-linecap="round"/></svg>
        </div>
        <div style="font-size: 22px; font-weight: 750; letter-spacing: -0.03em;">Support<span style="color: #6d884f; font-weight: 400;">Desk</span></div>
        <div style="font-size: 10px; font-weight: 650; letter-spacing: 0.14em; text-transform: uppercase; color: #7f9578; margin-top: -6px;">MAKE EVERY REPLY COUNT</div>
        <div style="width: 148px; height: 4px; background: #e4ece0; border-radius: 999px; overflow: hidden; position: relative; margin-top: 6px;">
          <div style="position: absolute; top: 0; bottom: 0; left: 0; width: 45%; background: linear-gradient(90deg, #174a40, #6d884f); border-radius: 999px; animation: brandPreloadSlide 1.5s cubic-bezier(0.65, 0, 0.35, 1) infinite;"></div>
        </div>
        <style>@keyframes brandPreloadSlide { 0% { left: -40%; width: 30%; } 50% { left: 25%; width: 55%; } 100% { left: 100%; width: 25%; } }</style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
